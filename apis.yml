aid: vividcortex
name: VividCortex
description: VividCortex is a SaaS database performance monitoring platform, now part of SolarWinds and
  marketed as SolarWinds Database Performance Monitor (DPM). It uses lightweight per-host agents to capture
  and analyze every query executed against MySQL, PostgreSQL, MongoDB, Redis, Amazon Aurora, and SQL Server
  workloads with sub-second, always-on visibility and minimal overhead. DPM surfaces query analysis, profiling,
  fault detection, adaptive alerting, and time-series metrics through a web application and a public REST
  API (v2) that exposes hosts, metrics and series data, observed queries and samples, timeline events,
  and alert configuration. VividCortex was acquired by SolarWinds in December 2019; this profile was surfaced
  as a portfolio company of Battery Ventures and enriched by the API Evangelist pipeline from the provider's
  live public documentation at docs.vividcortex.com.
