description: >-
  VividCortex / SolarWinds DPM ships no first-party general-purpose client SDKs for its
  v2 REST API on npm, PyPI, Maven Central, NuGet, pkg.go.dev, RubyGems, Packagist, or
  crates.io — the API is consumed directly over HTTP with a Bearer token. The
  VividCortex GitHub org is rich in open-source Go utility libraries (ewma, godaemon,
  mysqlerr, siesta) and agent-deployment packaging (docker, chef-cookbook, puppet,
  heroku-buildpack-vividcortex), but none are API client libraries. The one published
  first-party package that consumes the API is the archived hubot-vividcortex chatops
  script; the first-party Grafana data source plugin is catalogued in
  components/vividcortex-components.yml. No SDKs rating pointer is emitted because no
  general-purpose official client library exists.
